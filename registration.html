<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Registration page </title>
    <link rel="stylesheet" href="registration.css">
    <script src="https://kit.fontawesome.com/e20ad06a08.js" crossorigin="anonymous"></script>
</head>
<body>


    <!---------------------------------------------------
                Registration part Start here
    ----------------------------------------------------->

        <div class="register-container">

        <!------------- Heading part  ------->
            <h1> CREATE NEW ACCOUNT </h1>


        <form>

        <!----------- Full name part  ------->
            <div class="name-box">

            <span class="icon">
                <i class="fa-solid fa-user-plus"> </i> 
            </span>

            <input type="name" placeholder="Full Name">

            </div>


        <!----------- Email Address part  ------->
            <div class="email-box">

            <span class="icon">
                <i class="fa-solid fa-envelope"></i>
            </span>
            
            <input type="email" placeholder="Email">

            </div>


        <!----------- Phone Number part  ------->
            <div class="number-box">

            <span class="icon">
               <i class="fa-solid fa-phone"></i>
            </span>
            
            <input type="number" placeholder="Phone Number">

            </div>


        <!----------- Password part-1  ------->
            <div class="pass-box">

            <span class="icon">
                <i class="fa-solid fa-lock"></i>
            </span>
            
            <input type="password" placeholder="Strong Password">

            </div>


         <!----------- Password part-2  ------->
             <div class="re-pass-box">

            <span class="icon">
               <i class="fa-solid fa-user-lock"></i>
            </span>
            
            <input type="password" placeholder="Confirm Password">

            </div>


         <!----------- Check box part  ------->
            <div class="remember">

                <div class="check1">
                    <input type="checkbox">
                <p> Remember Me </p>
                </div>
                
                <div class="check2">
                    <input type="checkbox" >
                <p> Acceped All Condition </p>
                </div>

            </div>


         <!----------- Register Button part  ------->
         <div class="register-btn">

            <input type="button" value="Register">

         </div>


        </form>
        </div>


</body>
</html>
