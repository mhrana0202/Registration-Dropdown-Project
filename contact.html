<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact page</title>
    <link rel="stylesheet" href="contact.css">
    <script src="https://kit.fontawesome.com/e20ad06a08.js" crossorigin="anonymous"></script>
</head>
<body>


<!--------------- Parent Container part -------------------->
    <div class="contact-container">


<!--------------- Location-sector part -------------------->
        <div class="location-sector">

            <h1 class="loc-head"> Location </h1>

            <p class="loc"> Dewanganj Bazar. Dewanganj, Jamalpur. </p>

            <h1 class="icon-head"> Follow Us </h1>


<!--------------- Icons-sector part -------------------->
            <div class="icons">

                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-google"></i></a>

            </div>

            <p class="copy"> @2027 Privacy policy </p>

        </div>





<!--------------- Contact-text-area part -------------------->
        <div class="contact-text-area">

            <h1> Contact Form </h1>

            <input type="name" class="name" placeholder="Enter Your Name">

            <input type="email" class="email" placeholder="Enter a valid email address">

            <textarea class="text-box" rows="10" cols="50" placeholder="Enter your message"></textarea>

            <input type="button" class="submit-btn" value="Submit">
        </div>

    </div>
    
</body>
</html>
